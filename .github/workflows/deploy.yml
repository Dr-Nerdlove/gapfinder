name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in the order of the pushes. Without this, two merges a few seconds apart ran side by side and
# the older one, finishing last, overwrote the newer app on Pages (2026-11-09: 1.9.0 replaced 2.0.0). A run waits until
# the one before has finished; a waiting run is replaced by a newer push, so the newest commit always deploys last.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install age (the VM backup test encrypts with it, as the VM does)
        run: bash scripts/install-age.sh
      - run: npm run check
      - run: npm test

  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build the app
        # APP_BUILD is the same "sha-<7 characters>" the server image gets as APP_VERSION; the app compares the two.
        run: |
          export APP_BUILD="sha-${GITHUB_SHA::7}"
          npm run build -w web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Short commit id and app address
        id: sha
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "app_url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=sha-${{ steps.sha.outputs.short }}
            APP_URL=${{ steps.sha.outputs.app_url }}
          tags: |
            ghcr.io/dr-nerdlove/lueckenfueller-api:latest
            ghcr.io/dr-nerdlove/lueckenfueller-api:sha-${{ steps.sha.outputs.short }}
