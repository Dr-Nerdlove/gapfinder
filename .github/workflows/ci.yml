name: CI

# Pull requests and pushes to main only. A push to a branch with an open pull request would run
# every check twice (once per trigger); pull requests cover those branches.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the older run of the same pull request. Runs on main
# are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install age (the VM backup test encrypts with it, as the VM does)
        run: bash scripts/install-age.sh
      - run: npm run check
      - run: npm test
      - run: npm run build

  android:
    # Tests and debug build always; a signed test APK on pull requests and on pushes to main once
    # the signing secrets exist (docs/android-app.md). Pull requests from forks get no secrets,
    # so they never build a signed APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Decide whether a signed test APK is built
        id: signing
        env:
          # On pull requests GITHUB_SHA is the merge commit; the label names the branch's own commit.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          echo "label=sha-${sha::7}" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signed test APK was built: the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not available (not set, or a pull request from a fork; docs/android-app.md). Tests and debug build still run."
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Android app
        id: apk
        uses: ./.github/actions/android-apk
        with:
          keystore-base64: ${{ steps.signing.outputs.sign == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          keystore-password: ${{ steps.signing.outputs.sign == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          label: ${{ steps.signing.outputs.label }}
      - name: Keep the signed test APK
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: lueckenfueller-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

  vm-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the VM shell scripts (shellcheck is preinstalled on the runner)
        run: shellcheck deploy/vm/*.sh deploy/vm/test/*.sh scripts/*.sh
      - name: Install nftables and iproute2 (the firewall unit and its test need them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Check the systemd units
        # The service points at the installed script, so install it first, as setup.sh does.
        run: |
          sudo install -m 0755 deploy/vm/update.sh /usr/local/sbin/lueckenfueller-update
          sudo install -m 0755 deploy/vm/backup.sh /usr/local/sbin/lueckenfueller-backup
          sudo install -d /etc/lueckenfueller
          sudo install -m 0644 deploy/vm/firewall.nft /etc/lueckenfueller/firewall.nft
          systemd-analyze verify deploy/vm/lueckenfueller-update.service deploy/vm/lueckenfueller-update.timer \
            deploy/vm/lueckenfueller-backup.service deploy/vm/lueckenfueller-backup.timer \
            deploy/vm/lueckenfueller-firewall.service
      - name: Test the VM firewall (in network namespaces; the runner's own rules are not touched)
        run: sudo bash deploy/vm/test/firewall.test.sh
      - name: Check the VM compose file
        run: touch deploy/vm/.env && docker compose -f deploy/vm/compose.yaml config --quiet

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image (not pushed)
        run: docker build -f server/Dockerfile --build-arg APP_VERSION=ci -t lueckenfueller-api:ci .
