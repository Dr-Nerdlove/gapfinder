name: CI

# Pull requests only: every change reaches main through one, and deploy.yml tests main again
# before it publishes, so a run on the push to main would only repeat the same checks.
# No paths-ignore: the ruleset on main requires these checks, and a required check that never
# ran would block the merge of a documentation-only pull request.
# "Run workflow" (choose a branch) builds only a signed test APK of that branch, kept for 1 day.
on:
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the older run of the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install age (the VM backup test encrypts with it, as the VM does)
        run: bash scripts/install-age.sh
      - run: npm run check
      - run: npm test
      - run: npm run build

  android:
    # Pull requests: the stale-sync check, the Kotlin unit tests and the debug build, unsigned (no
    # secrets needed, so forks work too). "Run workflow": the signed release APK of the chosen
    # branch instead, as an artifact for 1 day (docs/android-app.md, "Installing").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Label for the APK file name
        id: label
        run: echo "label=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build the Android app
        id: apk
        uses: ./.github/actions/android-apk
        with:
          keystore-base64: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          keystore-password: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          require-signing: ${{ github.event_name == 'workflow_dispatch' }}
          label: ${{ steps.label.outputs.label }}
      - name: Keep the signed test APK (1 day)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: lueckenfueller-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 1
          if-no-files-found: error

  vm-scripts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the VM shell scripts (shellcheck is preinstalled on the runner)
        run: shellcheck deploy/vm/*.sh deploy/vm/test/*.sh scripts/*.sh
      - name: Install nftables and iproute2 (the firewall unit and its test need them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Check the systemd units
        # The service points at the installed script, so install it first, as setup.sh does.
        run: |
          sudo install -m 0755 deploy/vm/update.sh /usr/local/sbin/lueckenfueller-update
          sudo install -m 0755 deploy/vm/backup.sh /usr/local/sbin/lueckenfueller-backup
          sudo install -d /etc/lueckenfueller
          sudo install -m 0644 deploy/vm/firewall.nft /etc/lueckenfueller/firewall.nft
          systemd-analyze verify deploy/vm/lueckenfueller-update.service deploy/vm/lueckenfueller-update.timer \
            deploy/vm/lueckenfueller-backup.service deploy/vm/lueckenfueller-backup.timer \
            deploy/vm/lueckenfueller-firewall.service
      - name: Test the VM firewall (in network namespaces; the runner's own rules are not touched)
        run: sudo bash deploy/vm/test/firewall.test.sh
      - name: Check the VM compose file
        run: touch deploy/vm/.env && docker compose -f deploy/vm/compose.yaml config --quiet

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image (not pushed)
        run: docker build -f server/Dockerfile --build-arg APP_VERSION=ci -t lueckenfueller-api:ci .
